name: Tracker Max Jeune Auto

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-trains:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Installer les librairies
        run: pip install requests
        
      - name: Lancer la recherche
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: python main.py
        
      - name: Sauvegarder l'historique anti-spam
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add history.json || true
          git commit -m "Mise à jour historique notifs" || true
          git push || true
